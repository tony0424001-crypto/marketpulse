name: MarketPulse 自動更新

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 台灣 08:00（開盤前快報）
    - cron: '0 4 * * 1-5'   # 台灣 12:00（盤中分析）
    - cron: '0 9 * * 1-5'   # 台灣 17:00（盤後總結）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run market update
        env:
          GITHUB_TOKEN: ${{ secrets.MP_GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.MP_GIST_ID }}
          GROQ_KEY: ${{ secrets.MP_GROQ_KEY }}
        run: python scripts/update_market.py

      - name: Commit timestamp
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "bot@marketpulse"
          git add -A
          git diff --staged --quiet || git commit -m "auto: market update"
          git push || true
